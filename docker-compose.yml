services:
  marketplace:
    image: ${PREDICTION_MARKET_IMAGE:-private-prediction-market:local}
    build:
      context: .
      dockerfile: deploy/Dockerfile.market
    env_file:
      - ./deploy/env.production
    command: ["/app/deploy/start-render.sh"]
    ports:
      - "8790:8790"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8790/api/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  oracle-worker:
    image: ${PREDICTION_ORACLE_IMAGE:-private-prediction-oracle:local}
    build:
      context: .
      dockerfile: deploy/Dockerfile.oracle
    env_file:
      - ./deploy/env.production
    command: ["/app/deploy/start-oracle-worker.sh"]
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    depends_on:
      marketplace:
        condition: service_healthy

  tx-prover:
    image: ${PREDICTION_TX_PROVER_IMAGE:-private-prediction-tx-prover:local}
    build:
      context: .
      dockerfile: deploy/Dockerfile.tx-prover
    env_file:
      - ./deploy/env.production
    command: ["/app/deploy/start-tx-prover.sh"]
    ports:
      - "8789:8789"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
