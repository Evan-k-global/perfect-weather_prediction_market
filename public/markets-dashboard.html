<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Private Prediction Markets Dashboard</title>
    <style>
      :root {
        --ink: #101722;
        --paper: #f9fafb;
        --card: #ffffff;
        --line: #dbe1ea;
        --green: #168f5a;
        --red: #c94644;
      }
      body {
        margin: 0;
        font-family: "IBM Plex Sans", "Avenir Next", sans-serif;
        background: linear-gradient(135deg, #f4f7fb 0%, #ffffff 55%, #eef5ff 100%);
        color: var(--ink);
      }
      .wrap { max-width: 1100px; margin: 24px auto; padding: 0 16px; }
      h1 { margin: 0 0 10px; }
      .controls { display: flex; gap: 8px; margin-bottom: 12px; }
      input, button {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px;
        font: inherit;
      }
      button { background: #101722; color: white; cursor: pointer; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px;
      }
      .market { border-top: 1px solid var(--line); padding: 10px 0; }
      .market:first-child { border-top: 0; }
      .title { font-weight: 700; margin-bottom: 4px; }
      .meta { font-size: 12px; color: #49566a; margin-bottom: 4px; }
      .bar { display: flex; height: 10px; border-radius: 100px; overflow: hidden; border: 1px solid var(--line); }
      .yes { background: var(--green); }
      .no { background: var(--red); }
      @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } .controls { flex-direction: column; } }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Markets Dashboard</h1>
      <div class="controls">
        <input id="baseUrl" value="http://127.0.0.1:8788" />
        <input id="currentSlot" value="110" />
        <button id="refreshBtn">Refresh</button>
      </div>
      <div class="grid">
        <section class="card">
          <h3>Top by Total Bet</h3>
          <div id="topBet"></div>
        </section>
        <section class="card">
          <h3>Ending Soon</h3>
          <div id="endingSoon"></div>
        </section>
      </div>
    </div>
    <script>
      const topBetEl = document.getElementById('topBet');
      const endingSoonEl = document.getElementById('endingSoon');
      const renderList = (el, rows) => {
        el.innerHTML = rows.map((row) => {
          const yesPct = Math.round((row.impliedProbability || 0) * 100);
          const noPct = 100 - yesPct;
          return `
            <div class="market">
              <div class="title">${row.title}</div>
              <div class="meta">key ${row.marketKey} | total ${row.totalPositionBet} | tte ${row.timeToExpirySlots} slots</div>
              <div class="meta">source: ${row.settlementSource}</div>
              <div class="bar">
                <div class="yes" style="width:${yesPct}%"></div>
                <div class="no" style="width:${noPct}%"></div>
              </div>
              <div class="meta">YES ${yesPct}% / NO ${noPct}%</div>
            </div>
          `;
        }).join('') || '<div class="meta">No markets</div>';
      };

      async function refresh() {
        const base = document.getElementById('baseUrl').value.trim();
        const slot = document.getElementById('currentSlot').value.trim();
        const top = await fetch(`${base}/api/rankings/top-bet?current_slot=${encodeURIComponent(slot)}`).then(r => r.json());
        const soon = await fetch(`${base}/api/rankings/ending-soon?current_slot=${encodeURIComponent(slot)}`).then(r => r.json());
        renderList(topBetEl, top.rankings || []);
        renderList(endingSoonEl, soon.rankings || []);
      }
      document.getElementById('refreshBtn').addEventListener('click', refresh);
      refresh();
    </script>
  </body>
</html>
