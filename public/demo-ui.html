<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prediction Market Oracle Demo</title>
    <style>
      :root {
        --bg: #f4f4ef;
        --ink: #0f1a14;
        --card: #fffdf7;
        --line: #c8c1ad;
        --accent: #12613b;
      }
      body {
        margin: 0;
        font-family: "IBM Plex Sans", "Avenir Next", sans-serif;
        background: radial-gradient(circle at top left, #fff7de, var(--bg) 48%);
        color: var(--ink);
      }
      .wrap {
        max-width: 1100px;
        margin: 24px auto;
        padding: 0 16px;
      }
      .title {
        margin: 0 0 12px;
        font-size: 28px;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px;
      }
      label {
        display: block;
        font-size: 13px;
        margin: 10px 0 6px;
        font-weight: 600;
      }
      input, textarea, button {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px;
        font: inherit;
      }
      textarea {
        min-height: 180px;
        resize: vertical;
      }
      button {
        margin-top: 12px;
        background: var(--accent);
        color: white;
        font-weight: 700;
        cursor: pointer;
      }
      pre {
        margin: 0;
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 12px;
      }
      .hint {
        font-size: 12px;
        opacity: 0.8;
      }
      @media (max-width: 900px) {
        .grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1 class="title">Weather Oracle Adapter Demo</h1>
      <div class="grid">
        <section class="card">
          <p class="hint">Build a `WeatherOracleStatement` from TLSNotary-style attestation JSON.</p>
          <label>Market Key (Field)</label>
          <input id="marketKey" value="123456" />

          <label>Allowed Server Name</label>
          <input id="allowedServerName" value="api.weather.example" />

          <label>Allowed Request Path</label>
          <input id="allowedRequestPath" value="/v1/current?lat=40.7829&lon=-73.9654&units=metric" />

          <label>Max Age (ms)</label>
          <input id="maxAgeMs" value="300000" />

          <label>Threshold (tenth C)</label>
          <input id="thresholdTenthC" value="300" />

          <label>Observed At Slot</label>
          <input id="observedAtSlot" value="110" />

          <label>Nonce (Field)</label>
          <input id="nonce" value="444" />

          <label>Attestation JSON</label>
          <textarea id="attestation">{
  "server_name": "api.weather.example",
  "request_path": "/v1/current?lat=40.7829&lon=-73.9654&units=metric",
  "timestamp": 1767225600000,
  "response_body": "{\"current\":{\"temp_c\":31.4},\"location\":{\"code\":\"NYC-CENTRAL-PARK\"}}",
  "session_header_bytes_hex": "aabbccdd",
  "signature": { "r_hex": "11aa", "s_hex": "22bb" },
  "notary_public_key": { "x_hex": "33cc", "y_hex": "44dd" }
}</textarea>

          <button id="buildBtn">Build Statement</button>
        </section>

        <section class="card">
          <label>Adapter Output</label>
          <pre id="output">{}</pre>
        </section>
      </div>
    </div>

    <script>
      const byId = (id) => document.getElementById(id);
      const output = byId('output');

      byId('buildBtn').addEventListener('click', async () => {
        try {
          const payload = {
            marketKey: byId('marketKey').value.trim(),
            allowedServerName: byId('allowedServerName').value.trim(),
            allowedRequestPath: byId('allowedRequestPath').value.trim(),
            maxAgeMs: Number(byId('maxAgeMs').value.trim()),
            thresholdTenthC: byId('thresholdTenthC').value.trim(),
            observedAtSlot: byId('observedAtSlot').value.trim(),
            nonce: byId('nonce').value.trim(),
            attestation: JSON.parse(byId('attestation').value)
          };

          const res = await fetch('/api/build-statement', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const json = await res.json();
          output.textContent = JSON.stringify(json, null, 2);
        } catch (err) {
          output.textContent = JSON.stringify({ error: String(err) }, null, 2);
        }
      });
    </script>
  </body>
</html>
