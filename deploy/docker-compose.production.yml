services:
  marketplace:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - ./env.production
    command: ["pnpm", "marketplace:serve"]
    ports:
      - "8790:8790"
    volumes:
      - ../data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8790/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  weather-daemon:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - ./env.production
    command: ["pnpm", "weather:daemon"]
    volumes:
      - ../data:/app/data
      - ${ZKVERIFY_POC_HOST_PATH:-/opt/zk-verify-poc}:/opt/zk-verify-poc
    restart: unless-stopped
    depends_on:
      marketplace:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pnpm", "weather:daemon:health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
