services:
  - type: web
    name: perfect-weather-prediction-market
    env: docker
    dockerfilePath: ./deploy/Dockerfile
    plan: starter
    disk:
      name: perfect-weather-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: ZKVERIFY_POC_ROOT
        value: /opt/zk-verify-poc
      - key: WEATHER_DAEMON_ENABLED
        value: "0"
  - type: worker
    name: perfect-weather-operator-worker
    env: docker
    dockerfilePath: ./deploy/Dockerfile
    plan: starter
    dockerCommand: /app/deploy/start-operator-worker.sh
    envVars:
      - key: NODE_ENV
        value: production
      - key: ZKVERIFY_POC_ROOT
        value: /opt/zk-verify-poc
  - type: worker
    name: perfect-weather-oracle-worker
    env: docker
    dockerfilePath: ./deploy/Dockerfile
    plan: starter
    dockerCommand: /app/deploy/start-oracle-worker.sh
    envVars:
      - key: NODE_ENV
        value: production
      - key: ZKVERIFY_POC_ROOT
        value: /opt/zk-verify-poc
