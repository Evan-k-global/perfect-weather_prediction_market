services:
  - type: web
    name: perfect-weather-prediction-market
    env: docker
    dockerfilePath: ./deploy/Dockerfile.market
    healthCheckPath: /api/ready
    disk:
      name: perfect-weather-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: ZKVERIFY_POC_ROOT
        value: /opt/zk-verify-poc
      - key: TX_PROVER_BASE_URL
        fromService:
          type: web
          name: perfect-weather-tx-prover
          property: hostport
      - key: SYNC_STATE_ON_START
        value: "1"
      - key: SYNC_STATE_BLOCKING
        value: "0"
  - type: worker
    name: perfect-weather-oracle-worker
    env: docker
    dockerfilePath: ./deploy/Dockerfile.oracle
    dockerCommand: /app/deploy/start-oracle-worker.sh
    envVars:
      - key: NODE_ENV
        value: production
      - key: ZKVERIFY_POC_ROOT
        value: /opt/zk-verify-poc
      - key: MARKET_BASE_URL
        fromService:
          type: web
          name: perfect-weather-prediction-market
          property: hostport
      - key: ORACLE_WORKER_INTERVAL_MS
        value: "1800000"
      - key: ORACLE_WORKER_RETRY_MS
        value: "60000"
      - key: ORACLE_WORKER_START_DELAY_MS
        value: "5000"
      - key: ORACLE_WORKER_ENABLE_CHAIN_ACTIONS
        value: "1"
  - type: web
    name: perfect-weather-tx-prover
    env: docker
    dockerfilePath: ./deploy/Dockerfile.tx-prover
    dockerCommand: /app/deploy/start-tx-prover.sh
    envVars:
      - key: NODE_ENV
        value: production
      - key: ZKVERIFY_POC_ROOT
        value: /opt/zk-verify-poc
      - key: TX_PROVER_NODE_MAX_OLD_SPACE_MB
        value: "4096"
